<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Órdenes de Pizza</title>

    <!-- Conecta el archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Contenedor principal -->
    <div class="container">

        <!-- Título principal -->
        <h1>🍕 Órdenes en Cocina</h1>

        <!-- Subtítulo -->
        <p class="subtitle">Estado actual de pedidos</p>

        <!-- Lista de órdenes -->
        <div class="orders">

            <!-- Cada orden es una tarjeta -->
            <div class="order-card">
                <h2>Orden #001</h2>
                <p><strong>Cliente:</strong> Juan Pérez</p>
                <p><strong>Pedido:</strong> 2 Pepperoni grandes</p>
                <p class="status preparing">En preparación</p>
            </div>

            <div class="order-card">
                <h2>Orden #002</h2>
                <p><strong>Cliente:</strong> María López</p>
                <p><strong>Pedido:</strong> 1 Hawaiana + 1 Coca</p>
                <p class="status ready">Lista</p>
            </div>

        </div>

    </div>

</body>
</html>
